<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #9fb0c9;
        }

        .contenedor {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #4a90e2;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #4a90e2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #357abd;
        }

        .pw-wrap {
            position: relative;
            display: flex;
        }

        .pw-wrap input {
            padding-right: 80px;
        }

        .toggle-pw {
            position: absolute;
            right: 4px;
            top: 4px;
            bottom: 4px;
            width: auto;
            background: none;
            color: #1a5495;
            font-size: 13px;
            padding: 0 10px;
        }

        .strength {
            display: flex;
            gap: 4px;
            height: 4px;
            margin-top: 8px;
        }

        .strength span {
            flex: 1;
            background: #ddd;
            border-radius: 2px;
        }

        #mensaje {
            margin-top: 15px;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <h2>Crear cuenta</h2>

        <form id="formRegistro">
            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    required>
            </div>

            <div class="campo">
                <label for="nombre">Nombre</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Tu nombre"
                    required>
            </div>

            <div class="campo">
                <label for="apellido">Apellido</label>
                <input
                    type="text"
                    id="apellido"
                    name="apellido"
                    placeholder="Tu apellido"
                    required>
            </div>

            <div class="campo">
                <label for="edad">Edad</label>
                <input
                    type="number"
                    id="edad"
                    name="edad"
                    min="18"
                    max="100"
                    placeholder="18"
                    required>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>

                <div class="pw-wrap">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="********"
                        minlength="8"
                        required>

                    <button
                        type="button"
                        class="toggle-pw"
                        id="togglePw">
                        Mostrar
                    </button>
                </div>

                <div class="strength" id="strength">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <button type="submit">Registrarse</button>
        </form>

        <div id="mensaje"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
