<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="contenedor">

    <h2>Crear cuenta</h2>

    <form id="formRegistro">

        <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="ejemplo@correo.com"
                required>
        </div>

        <div class="campo">
            <label for="nombre">Nombre</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Tu nombre"
                required>
        </div>

        <div class="campo">
            <label for="apellido">Apellido</label>
            <input
                type="text"
                id="apellido"
                name="apellido"
                placeholder="Tu apellido"
                required>
        </div>

        <div class="campo">
            <label for="edad">Edad</label>
            <input
                type="number"
                id="edad"
                name="edad"
                min="18"
                max="100"
                placeholder="18"
                required>
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <div class="pw-wrap">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="********"
                    minlength="8"
                    required>
                <button type="button" class="toggle-pw" id="togglePw">Mostrar</button>
            </div>
            <div class="strength" id="strength">
                <span></span><span></span><span></span><span></span>
            </div>
        </div>

        <button type="submit">
            Registrarse
        </button>

    </form>

</div>

<script src="script.js"></script>
</body>
</html>
